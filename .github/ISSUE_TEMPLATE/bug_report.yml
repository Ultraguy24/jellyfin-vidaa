name: Bug report
description: Report a reproducible issue with the app or a supported device.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the issue.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: TV model
      placeholder: Hisense 85Q7STUK
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Full firmware/software version
    validations:
      required: true
  - type: textarea
    id: user-agent
    attributes:
      label: Browser user agent
      description: Copy this from the Device Inspector if possible.
      render: text
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console errors or relevant logs
      render: text
